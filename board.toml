# Board description of the Motorola Moto G9 Play (guamp, SM6115), derived from UniXNU-gta4l.

[board]
name = "guamp"
soc = "SM6115"
description = "Motorola Moto G9 Play"
kit = "guamp"                      # the package/ of this repository appears as kits/guamp in the build tree

# The target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore image. Give --ipsw PATH to use a local file; without
# it the remote url is read with range requests, only the members that are needed.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]   # the small components

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# guamp uses eMMC (mmcblk0) with 512-byte logical sectors; first_lba/last_lba are the GPT entry of "userdata" (mmcblk0p77),
# read from the device in TWRP on 2026-10-22.
[userdata]
first_lba = 0x1634000
last_lba = 0x747bfde
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "guamp_defconfig"
# Archive builders of the kernel step, in order. Each is a script of the build tree with its arguments.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-guamp-display-stub.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "guamp"                   # Resources/Configs/guamp.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Motorola/guampPkg/guamp.dsc"
fd = "Build/guampPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Motorola",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Motorola",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "guamp"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "guamp-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
timeout = 1                          # menu timeout (s): fast probe loop
volume = "GUAMPESP"
size_mib = 64                        # guamp ABL: "Not Enough space left to load kernel image" with 192 MiB
loader = "firmware"
title = "guamp first boot: source 4K XNU to console"
dram_size = "0x100000000"             # 4 GiB LPDDR4x from 0x40000000 (fastboot: ram 4GB)
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = false                 # broken display; no room next to the stage 3 probe in the kernel padding
# Stage 3 probe: 6 s after the MMU is on the kernel resets the device (PSCI). A reboot by itself
# shows that XNU got that far; with "fastboot oem fb_mode_set" the phone then waits in fastboot.
entry_probe_reset_delay = 2
entry_probe_reset_after = "_wfe_timeout_init"
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "boot-progress=2",
]

[payload.adt]
tool = "scripts/make-guamp-adt.py"
chip_id = "0x1bc"                    # SM6115
owned_memory_size = "0x100000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# Kryo 260: Silver cluster 0x0-0x3, Gold cluster 0x100-0x103 (Affinity1 numbering)
cpu_regs = "0x0,0x1,0x2,0x3,0x100,0x101,0x102,0x103"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; these override them
# with ramdisk_offset 0x20000000 as on gta4l (same SoC): the original guamp offset 0x01000000 would put a
# 192 MiB payload over the DTB at 0x01F00000. Not yet verified on the guamp ABL.
[bootimg.image]
base = 0
kernel_offset = 0x00008000
ramdisk_offset = 0x20000000
tags_offset = 0x00000100
pagesize = 4096
header_version = 2
dtb_offset = 0x01F00000              # same as the stock guamp boot image
